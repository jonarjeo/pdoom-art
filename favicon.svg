<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="pdoom skull">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3d71"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0d12"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.5"/>
  <!-- skull -->
  <ellipse cx="32" cy="28" rx="16" ry="15" fill="#e8ecf4"/>
  <rect x="22" y="38" width="20" height="10" rx="3" fill="#e8ecf4"/>
  <!-- eyes -->
  <ellipse cx="25" cy="28" rx="4.5" ry="5.5" fill="#0b0d12"/>
  <ellipse cx="39" cy="28" rx="4.5" ry="5.5" fill="#0b0d12"/>
  <circle cx="26.5" cy="27" r="1.4" fill="#ff3d71"/>
  <circle cx="40.5" cy="27" r="1.4" fill="#ff3d71"/>
  <!-- nose -->
  <path d="M32 32 l-3 5 h6 z" fill="#0b0d12"/>
  <!-- teeth -->
  <path d="M25 44 v4 M29 44 v5 M35 44 v5 M39 44 v4" stroke="#0b0d12" stroke-width="1.6" stroke-linecap="round"/>
  <!-- tiny doom spark -->
  <circle cx="50" cy="14" r="2.5" fill="#ff3d71"/>
</svg>
